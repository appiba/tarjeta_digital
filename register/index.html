<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | Loyalty</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-root="../">
  <main class="auth-layout">
    <section class="auth-card">
      <a class="brand" href="../index.html">
        <span class="brand__mark">L</span>
        <span>Loyalty</span>
      </a>
      <h1 style="margin-top: 22px;">Crear mi tarjeta</h1>
      <p data-register-state>Validando negocio...</p>
      <form class="form" data-register-customer-form hidden>
        <div class="field">
          <label for="full_name">Nombre completo</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="phone">WhatsApp</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" required>
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email">
        </div>
        <button class="button button--primary" type="submit">Crear tarjeta</button>
      </form>
      <section class="panel-card" data-register-result hidden></section>
    </section>
  </main>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/register.js"></script>
  <script>RegisterApp.init();</script>
</body>
</html>
