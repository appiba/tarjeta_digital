<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | Loyalty</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-root="../">
  <main class="auth-layout">
    <section class="auth-card">
      <a class="brand" href="../index.html">
        <span class="brand__mark">L</span>
        <span>Loyalty</span>
      </a>
      <h1 style="margin-top: 22px;">Crear mi tarjeta</h1>
      <p>Formulario publico preparado para registrar clientes por codigo de negocio.</p>
      <form class="form">
        <div class="field">
          <label for="full_name">Nombre completo</label>
          <input id="full_name" type="text" disabled>
        </div>
        <div class="field">
          <label for="phone">WhatsApp</label>
          <input id="phone" type="tel" disabled>
        </div>
        <button class="button button--primary" type="button" disabled>Crear tarjeta</button>
      </form>
    </section>
  </main>
</body>
</html>
