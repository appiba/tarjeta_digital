<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5eff">
  <title>Iniciar sesion | Loyalty</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/main.css?v=wallet-v18">
</head>
<body data-root="">
  <main class="auth-layout">
    <section class="auth-card">
      <a class="brand" href="index.html" aria-label="Loyalty">
        <span class="brand__mark">L</span>
        <span>Loyalty</span>
      </a>
      <h1 style="margin-top: 22px;">Iniciar sesion</h1>
      <p>Acceso para administrador general, propietario de negocio y staff.</p>

      <div class="alert" data-api-warning>
        Falta conectar el Web App de Apps Script. Pega la URL que termina en <strong>/exec</strong> en <strong>assets/js/api.js</strong>; luego el panel validara tu administrador en Google Sheets.
      </div>

      <form class="form" data-login-form>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contrasena</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button--primary" type="submit">Entrar</button>
      </form>
    </section>
  </main>

  <script src="assets/js/utils.js?v=wallet-v18"></script>
  <script src="assets/js/api.js?v=wallet-v18"></script>
  <script src="assets/js/auth.js?v=wallet-v18"></script>
  <script>Auth.initLoginPage();</script>
</body>
</html>
