<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promociones | Loyalty</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=simple-mvp-v1">
  <link rel="stylesheet" href="../assets/css/business.css?v=simple-mvp-v1">
</head>
<body class="business-accent" data-root="../">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="../index.html"><span class="brand__mark">L</span><span>Loyalty</span></a>
      <nav aria-label="Negocio">
        <a href="index.html"><i data-lucide="layout-dashboard"></i>Inicio</a>
        <a href="scanner.html"><i data-lucide="scan-line"></i>Escanear</a>
        <a class="is-active" href="promociones.html"><i data-lucide="megaphone"></i>Promociones</a>
        <a href="clientes.html"><i data-lucide="users"></i>Clientes</a>
        <a href="configuracion.html"><i data-lucide="settings"></i>Configuracion</a>
        <button type="button" data-logout><i data-lucide="log-out"></i>Cerrar sesion</button>
      </nav>
    </aside>
    <main class="content">
      <section class="panel-heading">
        <div>
          <span class="badge" data-page-label>Promociones</span>
          <h1>Promociones</h1>
          <p>Beneficios simples asociados al nivel general del cliente.</p>
        </div>
        <div class="user-chip"><span data-user-name>Usuario</span></div>
      </section>
      <section class="panel-card">
        <div class="panel-heading">
          <div>
            <h2>Promociones</h2>
            <p>Define que beneficio se muestra cuando el cliente llega a un nivel.</p>
          </div>
        </div>
        <form class="form" data-business-promotion-form>
          <div class="section-grid">
            <div class="field">
              <label for="title">Nombre promocion</label>
              <input id="title" name="title" type="text" placeholder="20% de descuento" required>
            </div>
            <div class="field">
              <label for="level_required">Nivel requerido</label>
              <input id="level_required" name="level_required" type="number" min="1" max="1001" value="1" required>
            </div>
            <div class="field">
              <label for="start_date">Se activa desde</label>
              <input id="start_date" name="start_date" type="date">
            </div>
            <div class="field">
              <label for="end_date">Termina</label>
              <input id="end_date" name="end_date" type="date">
            </div>
            <div class="field">
              <label for="status">Estado</label>
              <select id="status" name="status">
                <option value="active">Activa</option>
                <option value="disabled">Deshabilitada</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="description">Descripcion</label>
            <textarea id="description" name="description" rows="3" placeholder="Valido al presentar el codigo LOY en caja."></textarea>
          </div>
          <button class="button button--primary" type="submit"><i data-lucide="save"></i>Guardar</button>
        </form>
      </section>
      <section class="client-list" data-business-promotions-list></section>
    </main>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../assets/js/utils.js?v=simple-mvp-v1"></script>
  <script src="../assets/js/api.js?v=simple-mvp-v1"></script>
  <script src="../assets/js/auth.js?v=simple-mvp-v1"></script>
  <script src="../assets/js/business.js?v=simple-mvp-v1"></script>
  <script>BusinessApp.initPromotions();</script>
</body>
</html>
