<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5eff">
  <title>Solicitud | Loyalty</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/main.css?v=wallet-v17">
</head>
<body data-root="">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark">L</span>
        <span>Loyalty</span>
      </a>
      <div class="nav-actions">
        <a class="button button--ghost" href="login.html">Iniciar sesion</a>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="panel-heading">
      <div>
        <span class="badge">Solicitud</span>
        <h1>Solicitud de negocio</h1>
        <p>Envia tu negocio para revision. El administrador debe aprobarlo antes de que puedas usar la plataforma.</p>
      </div>
    </section>

    <div class="alert" data-api-warning>
      Falta configurar <strong>API_URL</strong> en <strong>assets/js/api.js</strong>.
    </div>

    <section class="panel-card" data-request-success hidden></section>

    <section class="panel-card">
      <form class="form" data-business-request-form>
        <div class="field">
          <label for="business_name">Nombre del negocio</label>
          <input id="business_name" name="business_name" type="text" maxlength="140" required>
        </div>
        <div class="field">
          <label for="owner_name">Propietario</label>
          <input id="owner_name" name="owner_name" type="text" maxlength="140" required>
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" maxlength="160" required>
        </div>
        <div class="field">
          <label for="owner_password">Clave para entrar al panel</label>
          <input id="owner_password" name="owner_password" type="password" minlength="6" maxlength="80" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="owner_password_confirm">Confirmar clave</label>
          <input id="owner_password_confirm" name="owner_password_confirm" type="password" minlength="6" maxlength="80" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="whatsapp">WhatsApp</label>
          <input id="whatsapp" name="whatsapp" type="tel" maxlength="40" required>
        </div>
        <div class="field">
          <label for="phone">Telefono adicional</label>
          <input id="phone" name="phone" type="tel" maxlength="40">
        </div>
        <div class="field">
          <label for="city">Ciudad</label>
          <input id="city" name="city" type="text" maxlength="100">
        </div>
        <div class="field">
          <label for="address">Direccion</label>
          <input id="address" name="address" type="text" maxlength="180">
        </div>
        <div class="field">
          <label for="business_type">Tipo de negocio</label>
          <select id="business_type" name="business_type" required>
            <option value="">Seleccionar</option>
            <optgroup label="Comida y bebidas">
              <option value="Cafe">Cafe</option>
              <option value="Restaurante">Restaurante</option>
              <option value="Comida rapida">Comida rapida</option>
              <option value="Panaderia">Panaderia</option>
              <option value="Pasteleria">Pasteleria</option>
              <option value="Heladeria">Heladeria</option>
              <option value="Pizzeria">Pizzeria</option>
              <option value="Food truck">Food truck</option>
              <option value="Bar">Bar</option>
            </optgroup>
            <optgroup label="Belleza y cuidado personal">
              <option value="Barberia">Barberia</option>
              <option value="Peluqueria">Peluqueria</option>
              <option value="Salon de belleza">Salon de belleza</option>
              <option value="Spa">Spa</option>
              <option value="Unas">Unas</option>
              <option value="Cejas y pestanas">Cejas y pestanas</option>
              <option value="Masajes">Masajes</option>
              <option value="Estetica">Estetica</option>
            </optgroup>
            <optgroup label="Tiendas y comercio">
              <option value="Tienda de ropa">Tienda de ropa</option>
              <option value="Tienda de barrio">Tienda de barrio</option>
              <option value="Minimarket">Minimarket</option>
              <option value="Farmacia">Farmacia</option>
              <option value="Papeleria">Papeleria</option>
              <option value="Ferreteria">Ferreteria</option>
              <option value="Tecnologia">Tecnologia</option>
              <option value="Regalos">Regalos</option>
            </optgroup>
            <optgroup label="Servicios">
              <option value="Gimnasio">Gimnasio</option>
              <option value="Lavanderia">Lavanderia</option>
              <option value="Mascotas">Mascotas</option>
              <option value="Veterinaria">Veterinaria</option>
              <option value="Floristeria">Floristeria</option>
              <option value="Autolavado">Autolavado</option>
              <option value="Taller mecanico">Taller mecanico</option>
              <option value="Servicios profesionales">Servicios profesionales</option>
              <option value="Salud y clinica">Salud y clinica</option>
              <option value="Educacion">Educacion</option>
            </optgroup>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="field">
          <label for="primary_color">Color principal</label>
          <input id="primary_color" name="primary_color" type="color" value="#1f5eff">
        </div>
        <div class="field">
          <label for="secondary_color">Color secundario</label>
          <input id="secondary_color" name="secondary_color" type="color" value="#12b981">
        </div>
        <div class="field">
          <label for="loyalty_type">Tipo de lealtad</label>
          <select id="loyalty_type" name="loyalty_type" required>
            <option value="STAMPS">Sellos</option>
            <option value="POINTS">Puntos</option>
            <option value="VISITS">Visitas</option>
          </select>
        </div>
        <div class="field">
          <label for="suggested_goal">Meta</label>
          <input id="suggested_goal" name="suggested_goal" type="number" min="1" step="1" value="10" required>
        </div>
        <div class="field">
          <label for="suggested_reward">Premio</label>
          <select id="suggested_reward" name="suggested_reward" required>
            <option value="">Seleccionar premio</option>
            <option value="1 cafe gratis">1 cafe gratis</option>
            <option value="Bebida gratis">Bebida gratis</option>
            <option value="Postre gratis">Postre gratis</option>
            <option value="Producto gratis">Producto gratis</option>
            <option value="Servicio gratis">Servicio gratis</option>
            <option value="Corte gratis">Corte gratis</option>
            <option value="Lavado gratis">Lavado gratis</option>
            <option value="Envio gratis">Envio gratis</option>
            <option value="Descuento del 10%">Descuento del 10%</option>
            <option value="Descuento del 15%">Descuento del 15%</option>
            <option value="Descuento del 20%">Descuento del 20%</option>
            <option value="Descuento del 25%">Descuento del 25%</option>
            <option value="Descuento del 30%">Descuento del 30%</option>
            <option value="Combo especial">Combo especial</option>
            <option value="2x1">2x1</option>
            <option value="Puntos dobles">Puntos dobles</option>
            <option value="Upgrade gratis">Upgrade gratis</option>
            <option value="Membresia especial">Membresia especial</option>
            <option value="Regalo sorpresa">Regalo sorpresa</option>
            <option value="Premio especial">Premio especial</option>
          </select>
        </div>
        <button class="button button--primary" type="submit">Enviar solicitud</button>
      </form>
    </section>
  </main>
  <script src="assets/js/utils.js?v=wallet-v17"></script>
  <script src="assets/js/api.js?v=wallet-v17"></script>
  <script src="assets/js/request.js?v=wallet-v17"></script>
  <script>RequestApp.initBusinessRequestForm();</script>
</body>
</html>
