<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi tarjeta | Loyalty</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/client.css">
</head>
<body data-root="../">
  <main class="client-shell">
    <section class="client-placeholder">
      <div class="client-card">
        <div class="client-card__bar">
          <a href="../index.html" aria-label="Volver"><i data-lucide="chevron-left"></i></a>
          <strong>Mi tarjeta de lealtad</strong>
          <i data-lucide="settings"></i>
        </div>
        <div class="coffee-card" data-client-card>
          <div class="coffee-card__hero">
            <div>
              <div class="loyalty-preview__logo" data-business-initials>L</div>
              <h1 data-business-name>Loyalty</h1>
              <p data-business-type>Tarjeta digital</p>
            </div>
          </div>
          <div class="coffee-card__body">
            <strong>Hola, <span data-customer-name>Cliente</span></strong>
            <div><strong data-progress-label>0 de 10 sellos</strong> <span style="float:right;" data-progress-percent>0%</span></div>
            <div class="coffee-beans" data-progress-beans></div>
            <p data-progress-left>Presenta esta tarjeta en el local.</p>
            <div class="reward-strip"><i data-lucide="gift"></i><strong>Premio: <span data-reward-name>Premio especial</span></strong></div>
            <div class="visual-qr" aria-label="QR visual">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <p style="text-align:center;">Presenta este codigo en el local</p>
          </div>
        </div>
        <div class="mini-promo">
          <strong>Promo de hoy</strong>
          <p>2x1 en cappuccino</p>
        </div>
      </div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Cliente">
    <a class="is-active" href="index.html"><i data-lucide="badge"></i>Tarjeta</a>
    <a href="historial.html"><i data-lucide="clock-3"></i>Historial</a>
    <a href="promociones.html"><i data-lucide="megaphone"></i>Promos</a>
    <a href="perfil.html"><i data-lucide="user"></i>Perfil</a>
  </nav>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/client.js"></script>
  <script>ClientApp.initCard();</script>
</body>
</html>
